<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/student.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="card w-75 mx-auto">
        <div class="card-body position-relative p-0">
          <div class="row p-0">
            <!-- <div class="col-12"></div> -->
              <!-- tab -->
              <div class="col-xl-3 col-lg-4 col-md-5 col-12 ">
                <ul class="nav nav-pills nav-tabs flex-column d-flex align-items-center justify-content-start gap-2 h-100">
                  <li class="nav-item">
                    <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai1"
                    >
                      Bài 1
                    </button>
                    <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai2"
                    >
                      Bài 2
                    </button>
                  </li>
                  <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai3"
                    >
                      Bài 3
                    </button>
                  </li>
                  <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai4"
                    >
                      Bài 4
                    </button>
                  </li>
                  <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai5"
                    >
                      Bài 5
                    </button>
                  </li>
                  </li>
                    <button
                      class="nav-link btn-tabs mb-2 active"
                      data-bs-toggle="pill"
                      data-bs-target="#bai6"
                    >
                      Bài 6
                    </button>
                  </li>
                  <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai7"
                    >
                      Bài 7
                    </button>
                  </li>
                  <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai8"
                    >
                      Bài 8
                    </button>
                  </li>
                  <li class="nav-item">
                    <button
                      class="nav-link btn-tabs mb-2"
                      data-bs-toggle="pill"
                      data-bs-target="#bai9"
                    >
                      Bài 9
                    </button>
                  </li>
                  
                </ul>
              </div>
            <div class="col-xl-9 col-lg-8 col-md-7 col-12">
            <div class="tab-content">
              <div class="tab-pane fade" id="bai1">
                <h4>💰 Tính tiền lương nhân viên</h4>
                <ul class="list-unstyled">
                  <li>
                    <input id="dailySalary" type="number" placeholder="Nhập lương 1 ngày">
                  </li>
                  <li>
                    <input id="workingDay" type="number" placeholder="Số ngày làm">
                  </li>
                </ul>
                <button id="btnCalcSalary" type="button" class="btn btn-primary">Kết quả</button>  
                <div id="resultSalary" class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade" id="bai2">
                <h4>📚 Tính giá trị trung bình</h4>
                <ul class="list-unstyled">
                  <li>
                    <input id="num1" type="number" placeholder="Nhập số thứ 1">
                  </li>
                  <li>
                    <input id="num2" type="number" placeholder="Nhập số thứ 2">
                  </li>
                  <li>
                    <input id="num3" type="number" placeholder="Nhập số thứ 3">
                  </li>
                  <li>
                    <input id="num4" type="number" placeholder="Nhập số thứ 4">
                  </li>
                  <li>
                    <input id="num5" type="number" placeholder="Nhập số thứ 5">
                  </li>
                </ul>
                <button id="btnCalculate" type="button" class="btn btn-primary">Kết quả</button>  
                <div id="result" class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade" id="bai3">
                <h4>💱 Quy đổi tiền</h4>
                <ul class="list-unstyled">
                  <li>
                    <input id="amountUSD" type="number" placeholder="Nhập số tiền USD">
                  </li>
                </ul>
                <button id="btnConvert" type="button" class="btn btn-primary">Kết quả</button>  
                <div id="resultvnd" class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade" id="bai4">
                <h4>📏 Tính diện tích, chu vi hình chữ nhật</h4>
                <ul class="list-unstyled">
                  <li>
                    <input id="Length-El" type="number" placeholder="Nhập chiều dài">
                  </li>
                  <li>
                    <input id="Width-El" type="number" placeholder="Nhập chiều rộng">
                  </li>
                </ul>
                <button id="btn-El" type="button" class="btn btn-primary">Kết quả</button>  
                <div id="resultMath-El" class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade" id="bai5">
                <h4>🧮 Tính tổng 2 ký số</h4>
                <ul class="list-unstyled">
                  <li>
                    <input id="numberInput" type="number" placeholder="Nhập số có 2 chữ số">
                  </li>                 
                </ul>
                <button id="calcBtn" type="button" class="btn btn-primary">Kết quả</button>  
                <div id="resultMath" class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade show active" id="bai6">
                <h4>🏫 Quản lý tuyển sinh</h4>
                <ul class="list-unstyled">
                  <li>
                    <input id="benchmarkScore" type="number" placeholder="Điểm chuẩn">
                  </li>
                  <li>
                    <select id="regionSelect" class="form-select">
                      <option value="0">Chọn khu vực</option>
                      <option value="2">A</option>
                      <option value="1">B</option>
                      <option value="0.5">C</option>
                    </select>
                  </li>
                  <li>
                    <select id="targetGroupSelect" class="form-select">
                      <option value="0">Chọn đối tượng</option>
                      <option value="2.5">1</option>
                      <option value="1.5">2</option>
                      <option value="1">3</option>
                    </select>
                  </li>
                  <li>
                    <input id="subjectScore1" type="number" placeholder="Điểm thi môn thứ 1">
                  </li>
                  <li>
                    <input id="subjectScore2" type="number" placeholder="Điểm thi môn thứ 2">
                  </li>
                  <li>
                    <input id="subjectScore3" type="number" placeholder="Điểm thi môn thứ 3">
                  </li>
                </ul>
                <button id="result" type="button" class="btn btn-primary">Kết Quả</button>  
                <div id="resultAlert" class="alert alert-success" role="alert" style="display: none;">
                </div>          
              </div>
              <div class="tab-pane fade" id="bai7">
                <h4>🔋 Kết quả</h4>
                <ul class="list-unstyled">
                  <li>
                    <input type="text" placeholder="Nhập họ và tên">
                  </li>
                  <li>
                    <input type="number" placeholder="Nhập số KW">
                  </li>
                </ul>
                <button type="button" class="btn btn-primary">Kết quả</button>  
                <div class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade" id="bai8">
                <h4>💰 Tính thuế thu nhập cá nhân</h4>
                <ul class="list-unstyled">
                  <li>
                    <input type="text" placeholder="Nhập họ và tên">
                  </li>
                  <li>
                    <input type="number" placeholder="Tổng thu nhập">
                  </li>
                  <li>
                    <input type="number" placeholder="Số người phụ thuộc">
                  </li>
                </ul>
                <button type="button" class="btn btn-primary">Tính tiền thuế</button>  
                <div class="alert alert-success" role="alert">
                </div>  
              </div>
              <div class="tab-pane fade" id="bai9">
                <h4>🕸️ Tính tiền cáp</h4>
                <ul class="list-unstyled">
                  <li>
                    <select name="" id="">
                      <option value="0">Chọn loại khách hàng</option>
                      <option value="1">Nhà dân</option>
                      <option value="2">Doanh nghiệp</option>
                    </select>
                  </li>
                  <li>
                    <input type="text" placeholder="Nhập mã khách hàng">
                  </li>
                  <li>
                    <input type="number" placeholder="Số kênh cao cấp">
                  </li>
                </ul>
                <button id="showresult"  type="button" class="btn btn-primary">Tính tiền cáp</button>  
                <div class="alert alert-success" role="alert">
                </div>  
              </div>
          </div>    
        </div>
      </div>
    </div>
    <script type="module" src="../js/main.js"></script>
    <!-- BS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
